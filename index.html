<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva de Turnos - Centro Médico Integral Vida</title>
    <!-- Enlace al archivo CSS (opcional) -->
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        .logo-consultorio {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
            border: 3px solid #0077b6;
        }
        h2 {
            color: #0077b6;
            margin-bottom: 5px;
        }
        .subtitulo {
            font-size: 14px;
            color: #666;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
            font-size: 14px;
        }
        select, input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            background-color: #0077b6;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.3s ease;
        }
        button:hover {
            background-color: #023e8a;
        }
        .contacto-info {
            margin-top: 20px;
            font-size: 12px;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Imagen / Logo institucional llamativo -->
        <img src="https://images.unsplash.com/photo-1519494026892-80bbd2d6fd0d?auto=format&fit=crop&w=300&q=80" alt="Logo Centro Médico" class="logo-consultorio">
        
        <h2>Centro Médico Integral Vida</h2>
        <p class="subtitulo">Sistema de Gestión y Reserva de Turnos Online</p>

        <!-- Formulario vinculado con Apps Script -->
        <form id="form-turno">
            
            <div class="form-group">
                <label for="especialista">Seleccione Especialista:</label>
                <select id="especialista" required>
                    <option value="" disabled selected>Elija un profesional</option>
                    <option value="Dr. Mateo Fernández">Dr. Mateo Fernández</option>
                    <option value="Dra. Sofía Benítez">Dra. Sofía Benítez</option>
                    <option value="Dr. Lucas Gómez">Dr. Lucas Gómez</option>
                    <option value="Dra. Valentina Torres">Dra. Valentina Torres</option>
                    <option value="Dr. Joaquín Ramírez">Dr. Joaquín Ramírez</option>
                </select>
            </div>

            <div class="form-group">
                <label for="fecha">Fecha del Turno:</label>
                <input type="date" id="fecha" required>
            </div>

            <div class="form-group">
                <label for="hora">Horario (De 08:00 a 12:00 hs):</label>
                <select id="hora" required>
                    <option value="" disabled selected>Seleccione un horario</option>
                    <option value="08:00">08:00 hs</option>
                    <option value="09:00">09:00 hs</option>
                    <option value="10:00">10:00 hs</option>
                    <option value="11:00">11:00 hs</option>
                    <option value="12:00">12:00 hs</option>
                </select>
            </div>

            <div class="form-group">
                <label for="paciente">Nombre y Apellido del Paciente:</label>
                <input type="text" id="paciente" placeholder="Ej: Juan Pérez" required>
            </div>

            <div class="form-group">
                <label for="correo">Correo Electrónico:</label>
                <input type="email" id="correo" placeholder="correo@ejemplo.com" required>
            </div>

            <button type="submit">Confirmar y Reservar Turno</button>
        </form>

        <div class="contacto-info">
            <p>Contacto institucional: contacto@consultoriovida.com</p>
        </div>
    </div>

    <!-- Archivo JavaScript para la lógica -->
    <script src="script.js"></script>
</body>
</html>
